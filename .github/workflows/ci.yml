name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history is required so `git diff --check <base>...<head>` (PR) and
          # `git diff --check <before>..<after>` (push) can resolve both endpoints;
          # a shallow checkout would only contain the single checked-out commit.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run RAG tests
        run: npm run test:rag

      - name: Run RAG evaluation tool tests
        run: npm run test:rag-eval

      - name: Convert example RAG question set CSV to JSON
        run: npm run convert:rag-dataset -- --input examples/rag-eval/question-set.example.csv --output ${{ runner.temp }}/question-set.example.converted.json

      - name: Validate converted example RAG question set
        run: npm run validate:rag-dataset -- --input ${{ runner.temp }}/question-set.example.converted.json

      - name: Validate example RAG question set
        run: npm run validate:rag-dataset -- --input examples/rag-eval/question-set.example.json

      - name: Run frontend quality gate (lint, typecheck, build, whitespace/conflict check, structure tests)
        run: npm run check:frontend
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
